<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="title"><title id="title">FAI 航模运动门类速览</title><rect width="360" height="1000" rx="16" fill="#eef3f5"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="18" y="37" font-size="23" font-weight="700" fill="#15354c">一片天空，八种比赛门类</text><text x="18" y="68" font-size="17" fill="#526777">先看怎么飞，再看比赛在考什么</text>
<rect x="12" y="88" width="336" height="96" rx="10" fill="#fff" stroke="#d6e1e7"/><text x="24" y="121" font-size="24" font-weight="700" fill="#176e83">F1</text><text x="76" y="118" font-size="21" font-weight="700" fill="#15354c">自由飞</text><text x="76" y="145" font-size="16" fill="#526777">放飞后的性能与气流判断</text><text x="76" y="169" font-size="16" fill="#526777">F1A / F1B / F1D</text>
<rect x="12" y="194" width="336" height="96" rx="10" fill="#fff" stroke="#d6e1e7"/><text x="24" y="227" font-size="24" font-weight="700" fill="#176e83">F2</text><text x="76" y="224" font-size="21" font-weight="700" fill="#15354c">线操纵</text><text x="76" y="251" font-size="16" fill="#526777">竞速、特技、团体竞速、空战</text><text x="76" y="275" font-size="16" fill="#526777">通过操纵线连接</text>
<rect x="12" y="300" width="336" height="96" rx="10" fill="#fff" stroke="#d6e1e7"/><text x="24" y="333" font-size="24" font-weight="700" fill="#176e83">F3</text><text x="76" y="330" font-size="21" font-weight="700" fill="#15354c">遥控飞行</text><text x="76" y="357" font-size="16" fill="#526777">特技、滑翔、直升机、绕标</text><text x="76" y="381" font-size="16" fill="#526777">F3A / F3K / F3C</text>
<rect x="12" y="406" width="336" height="96" rx="10" fill="#fff" stroke="#d6e1e7"/><text x="24" y="439" font-size="24" font-weight="700" fill="#176e83">F4</text><text x="76" y="436" font-size="21" font-weight="700" fill="#15354c">像真模型</text><text x="76" y="463" font-size="16" fill="#526777">复现原机外形和飞行特征</text><text x="76" y="487" font-size="16" fill="#526777">F4C / F4H</text>
<rect x="12" y="512" width="336" height="96" rx="10" fill="#fff" stroke="#d6e1e7"/><text x="24" y="545" font-size="24" font-weight="700" fill="#176e83">F5</text><text x="76" y="542" font-size="21" font-weight="700" fill="#15354c">电动遥控</text><text x="76" y="569" font-size="16" fill="#526777">动力使用与滑翔任务</text><text x="76" y="593" font-size="16" fill="#526777">F5B / F5J</text>
<rect x="12" y="618" width="336" height="96" rx="10" fill="#fff" stroke="#d6e1e7"/><text x="24" y="651" font-size="24" font-weight="700" fill="#176e83">F7</text><text x="76" y="648" font-size="21" font-weight="700" fill="#15354c">浮空模型</text><text x="76" y="675" font-size="16" fill="#526777">靠浮力升空</text><text x="76" y="699" font-size="16" fill="#526777">热气球 F7A / 飞艇 F7B</text>
<rect x="12" y="724" width="336" height="96" rx="10" fill="#fff" stroke="#d6e1e7"/><text x="24" y="757" font-size="24" font-weight="700" fill="#176e83">F9</text><text x="76" y="754" font-size="21" font-weight="700" fill="#15354c">无人机运动</text><text x="76" y="781" font-size="16" fill="#526777">旗门竞速 / 团队攻防</text><text x="76" y="805" font-size="16" fill="#526777">F9U / F9A</text>
<rect x="12" y="830" width="336" height="96" rx="10" fill="#fff" stroke="#d6e1e7"/><text x="24" y="863" font-size="24" font-weight="700" fill="#176e83">S</text><text x="76" y="860" font-size="21" font-weight="700" fill="#15354c">航天模型</text><text x="76" y="887" font-size="16" fill="#526777">模型火箭与火箭滑翔</text><text x="76" y="911" font-size="16" fill="#526777">高度、留空、载荷、像真</text>
<text x="18" y="962" font-size="18" fill="#526777">项目代号 ≠ 飞手等级</text><text x="18" y="988" font-size="16" fill="#526777">电动 F3A 仍然属于 F3A · 2026</text></g></svg>